# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-library-codec"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-library-codec"
description = "Encoding primitives for Xmip: how a format's bytes and characters are written."

[lib]
path = "src/lib.rs"

[dependencies]
# The operating system's random source and nothing else: no generator in
# this process, no clock. `random` is its one caller in the estate.
getrandom = "0.4"
# XML cut into pieces: the one XML backend the estate links, read through
# `xml` and named by no crate above it (test/ThirdParty.Test.ps1). No
# default features: UTF-8 only, no serde, no encoding tables.
quick-xml = { version = "0.42", default-features = false }
# A document in another encoding — its byte order mark, or the encoding its
# XML declaration names, ISO-8859-1, Windows-1252, UTF-16 — decoded at the
# reader's edge (`xml::decoded`), strictly: bytes wrong for the encoding are
# refused, never replaced. The WHATWG encodings, pure Rust.
encoding_rs = "0.8"
# SHA-256 and its HMAC (`digest`), pure Rust, sha2 on the processor's SHA
# extensions where it has them: the one backend every SHA-256 and HMAC in
# the estate is computed by.
sha2 = "0.11"
hmac = "0.13"

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
